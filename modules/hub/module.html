<div class="mod-header">
  <span class="mod-title">⬡ Hub IA — Multi-Proveedor</span>
  <span id="hub-conn" class="badge badge-off">Desconectado</span>
</div>

<!-- Selector de proveedor -->
<div id="hub-providers" class="hub-providers">
  <!-- Generado por module.js -->
</div>

<!-- Chat principal -->
<div id="hub-shell">
  <div id="hub-messages">
    <div class="msg msg-sys">Selecciona un proveedor y escribe tu mensaje</div>
  </div>
  <div id="hub-footer">
    <textarea id="hub-input" placeholder="Escribe un mensaje…" rows="1"></textarea>
    <button id="hub-mic" class="mic-btn" title="Micrófono">🎤</button>
    <button id="hub-send" class="btn btn-primary btn-sm">▶</button>
  </div>
</div>

<!-- Panel Docker (bonus — usa misma API que Angel Control) -->
<div class="card hub-docker-card">
  <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
    <span>⊞ Contenedores Docker</span>
    <button class="btn btn-sm" onclick="window._HUB.refreshServers()">↺</button>
  </div>
  <div id="hub-servers"><div class="loading">Cargando…</div></div>
</div>
